# Travels: each entry below becomes a map pin and a photo card on /travels/.
#
# To add an entry:
#   1. Copy the placeholder entry below and fill in every field.
#      date is "YYYY-MM" in quotes (cards are sorted newest first).
#      lat/lng are decimal degrees (right-click a spot in Google Maps to copy them).
#   2. Photo (optional): strip metadata and resize it first, then put it in images/travels/:
#        python3 scripts/prep_photo.py ~/Desktop/original.jpg images/travels/short-name.jpg
#      (prep_photo.py removes EXIF/GPS and resizes to at most 1600px wide; it needs Pillow: pip install Pillow)
#      Set photo to the file name only, e.g. photo: "short-name.jpg", and describe it in photo_alt.
#   3. Remove the "placeholder: true" line. Entries with placeholder: true only show up
#      when you preview locally (bundle exec jekyll serve); they never appear on the live site.

- name: "[PLACEHOLDER] Place name — copy this entry"
  region: "Region / prefecture"
  country: "Country"
  date: "YYYY-MM"
  lat: 0
  lng: 0
  photo:                    # optional, e.g. "short-name.jpg" (file in images/travels/)
  photo_alt:                # short description of the photo, for screen readers
  caption: "One or two sentences about the trip."
  placeholder: true

